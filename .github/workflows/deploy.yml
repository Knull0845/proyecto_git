name: Deploy EC2 Docker Compose

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy with Docker Compose
        run: |
          ssh -i ~/.ssh/ec2_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            cd ${{ secrets.EC2_PROJECT_PATH }}

            echo "Actualizando código desde GitHub..."
            git pull origin main

            echo "Deteniendo contenedores anteriores..."
            docker-compose down -v

            echo "Construyendo imagen de forma nativa para evitar problemas de Buildx..."
            docker build -t app-sigas:latest .

            echo "Levantando servicios actualizados..."
            docker-compose up -d --force-recreate

            echo "Limpiando imágenes antiguas..."
            docker image prune -f

            echo "Despliegue finalizado."
          EOF
