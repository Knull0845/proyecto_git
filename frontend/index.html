<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGAS - Login TecNM</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>
    <div class="login-container">
        <div class="login-box">
            <div class="header">
                <img src="assets/IMG/Logo_TEC2.png" alt="Logo TecNM" class="logo">
                <h1>SIGAS-Cambio</h1>
                <p>Sistema de Gestión de Activos</p>
            </div>

            <form id="loginForm" novalidate>
                <div class="input-group">
                    <label for="correo">Correo Institucional</label>
                    <input
                        type="text"
                        id="correo"
                        name="correo"
                        placeholder="usuario@saltillo.tecnm.mx"
                        autocomplete="email"
                    >
                </div>

                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input
                        type="password"
                        id="password"
                        name="pass"
                        placeholder="••••••••"
                        autocomplete="current-password"
                    >
                </div>

                <button type="submit" class="btn-login">Entrar al Sistema</button>
            </form>

            <div class="footer">
                <span>TecNM - Instituto Tecnológico de Saltillo</span>
            </div>
        </div>
    </div>

    <script>
    // ═══════════════════════════════════════════════════════════════
    //  SIGAS — Validación de Login
    //  Cubre todos los escenarios de la Matriz de Pruebas (PDF)
    // ═══════════════════════════════════════════════════════════════

    const loginForm   = document.getElementById('loginForm');
    const correoInput = document.getElementById('correo');
    const passInput   = document.getElementById('password');

    // ── Configuración base de SweetAlert2 (modal grande, centrado) ──
    function mostrarError(titulo, texto) {
        return Swal.fire({
            icon: 'error',
            title: titulo,
            text: texto || '',
            confirmButtonText: 'Entendido',
            confirmButtonColor: '#6a1b31',
            allowOutsideClick: true,
            customClass: {
                popup:   'swal-popup-grande',
                title:   'swal-titulo',
                htmlContainer: 'swal-texto'
            }
        });
    }

    function mostrarAdvertencia(titulo, texto) {
        return Swal.fire({
            icon: 'warning',
            title: titulo,
            text: texto || '',
            confirmButtonText: 'Entendido',
            confirmButtonColor: '#6a1b31',
            allowOutsideClick: true,
            customClass: {
                popup:   'swal-popup-grande',
                title:   'swal-titulo',
                htmlContainer: 'swal-texto'
            }
        });
    }

    // ── Estilos para el modal grande ────────────────────────────────
    const estiloModal = document.createElement('style');
    estiloModal.textContent = `
        .swal-popup-grande {
            width: 480px !important;
            padding: 40px 30px !important;
            border-radius: 16px !important;
        }
        .swal-titulo {
            font-size: 1.4rem !important;
            font-weight: 700 !important;
            color: #333 !important;
            line-height: 1.4 !important;
        }
        .swal-texto {
            font-size: 1rem !important;
            color: #555 !important;
            margin-top: 8px !important;
        }
        .swal2-icon {
            width: 72px !important;
            height: 72px !important;
        }
        .swal2-confirm {
            padding: 10px 32px !important;
            font-size: 0.95rem !important;
            border-radius: 8px !important;
        }
    `;
    document.head.appendChild(estiloModal);

    // ── Validador de formato de correo ──────────────────────────────
    function validarFormatoCorreo(correo) {
        if (!correo.includes('@')) {
            return {
                valido: false,
                titulo: 'Correo sin @',
                texto:  `Incluye un signo de @ en la dirección de correo electrónico. La dirección "${correo}" no incluye el signo de "@"`
            };
        }

        const posArroba = correo.indexOf('@');
        const local     = correo.substring(0, posArroba);
        const dominio   = correo.substring(posArroba + 1);

        if (local.length === 0) {
            return {
                valido: false,
                titulo: 'Correo no aceptado',
                texto:  'La parte antes del @ no puede estar vacía.'
            };
        }
        const regexLocal = /^[a-zA-Z0-9._\-]+$/;
        if (!regexLocal.test(local)) {
            return {
                valido: false,
                titulo: 'Correo no aceptado',
                texto:  'Caracteres inválidos antes del @. Solo se permiten letras, números, puntos, guiones y guiones bajos.'
            };
        }

        if (dominio.length === 0) {
            return {
                valido: false,
                titulo: 'Caracteres inválidos después del @',
                texto:  'La parte del dominio no puede estar vacía.'
            };
        }
        const regexDominio = /^[a-zA-Z0-9.\-]+\.[a-zA-Z]{2,}$/;
        if (!regexDominio.test(dominio)) {
            return {
                valido: false,
                titulo: 'Caracteres inválidos después del @',
                texto:  `El dominio "${dominio}" contiene caracteres no permitidos o no tiene un formato válido (ej: saltillo.tecnm.mx).`
            };
        }

        return { valido: true };
    }

    // ── Listener principal del formulario ───────────────────────────
    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        const correo = correoInput.value.trim();
        const pass   = passInput.value;

        if (!correo && !pass) {
            await mostrarAdvertencia('Completa este campo', 'Debes ingresar tu correo y contraseña para continuar.');
            correoInput.focus();
            return;
        }

        if (!correo) {
            await mostrarAdvertencia('Completa este campo', 'El campo de correo institucional es obligatorio.');
            correoInput.focus();
            return;
        }

        if (!pass) {
            await mostrarAdvertencia('Completar este campo', 'El campo de contraseña es obligatorio.');
            passInput.focus();
            return;
        }

        const validacion = validarFormatoCorreo(correo);
        if (!validacion.valido) {
            await mostrarError(validacion.titulo, validacion.texto);
            correoInput.select();
            correoInput.focus();
            return;
        }

        // ─────────────────────────────────────────────────────────────
        // FETCH AL BACKEND
        // CORREGIDO: Se elimina "http://localhost:3000" para usar una ruta
        // relativa '/api/...'. Esto permite que funcione dinámicamente en producción.
        // ─────────────────────────────────────────────────────────────
        try {
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ correo, pass })
            });

            const contentType = response.headers.get('content-type');

            if (contentType && contentType.includes('application/json')) {
                const result = await response.json();

                if (result.success) {
                    localStorage.setItem('userRole',    result.user.Roles_ID_roles);
                    localStorage.setItem('userCorreo',  result.user.Correo);
                    localStorage.setItem('showWelcome', 'true');
                    window.location.href = 'menu.html';

                } else {
                    await mostrarError(
                        'Credenciales inválidas',
                        result.message || 'El correo o la contraseña no son correctos. Verifica tus datos e intenta de nuevo.'
                    );
                    passInput.value = '';
                    passInput.focus();
                }

            } else {
                await mostrarError(
                    'Error del servidor',
                    'El servidor no respondió correctamente. Intenta más tarde.'
                );
            }

        } catch (error) {
            console.error('Error de conexión:', error);
            await mostrarError(
                'Error de conexión',
                'No se pudo conectar con el servidor. Intenta de nuevo más tarde.'
            );
        }
    });
    </script>
</body>

</html>
